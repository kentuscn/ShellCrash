# HTTP(S) 代理端口
#port: 7890

# SOCKS5 代理端口
#socks-port: 7891

# HTTP(S) 和 SOCKS 代理混合端口
mixed-port: 7890

# Linux 和 macOS 的 redir 代理端口
# redir-port: 7892

# 是否允许局域网的连接（可用来共享代理）
allow-lan: true

bind-address: "*"

# 规则模式：rule（规则） / global（全局代理）/ direct（全局直连）/ script (脚本)
mode: rule

# 5 个级别：silent / error / warning / info / debug。从左至右级别依次递增，级别越高日志输出量越大
log-level: info

# 开启 IPv6 总开关，（开启true）（关闭false） 关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录 
ipv6: false

# 更换延迟计算方式，去除握手等额外延迟
unified-delay: true

# RESTful API 监听地址
external-controller: :9090

# DNS 服务配置
dns:
  enable: true      # 是否启用dns 启用 true 禁用false
  # cache-algorithm: arc  # DNS 缓存管理 相关的配置
  prefer-h3: false   # 使用 DoH 的 HTTP/3，提高解析速度
  use-hosts: true   # 允许使用 hosts 解析，默认 true
  use-system-hosts: true   # 是否使用系统 hosts，默认 true
  respect-rules: true     # 遵循 Clash 规则进行解析，防止 DNS 污染，启用 true 禁用false
  listen: 0.0.0.0:1053
  ipv6: false

 # 用于解析 nameserver，fallback 以及其他 DNS 服务器配置的 DNS 域名
 # 只能使用纯 IP 地址，可使用加密 DNS
  default-nameserver:
    - 223.5.5.5      # 阿里 IPv4
    - 119.29.29.29   # 腾讯 DNSPod IPv4
    - 8.8.8.8
    #- 2400:3200::1        # 阿里 IPv6
    #- 2400:3200:baba::1   # 阿里 IPv6
    #- 2402:4e00::         # 腾讯 IPv6
    #- 2402:4e00:100::     # 腾讯 IPv6
 
 # DNS 处理模式：可选值 normal / fake-ip / redir-host
 # 启用 fake-ip
  enhanced-mode: fake-ip
  #fake-ip-range: 28.0.0.1/8
  fake-ip-range: 198.18.0.1/16   #fake-ip 官方推荐的段
  
 # fake ip 筛选模式
 # 可选 blacklist/whitelist
 # 默认 blacklist
 # 即默认所有域名都会使用 fake-ip 解析，只有 fake-ip-filter 列表中的域名不会使用 fake-ip，而是返回真实 IP。
  #fake-ip-filter-mode: blacklist
 
 # fake ip 白名单列表，匹配到的将返回真实 IP
  fake-ip-filter:
    #- "+.*"                       # [不推荐] 回退所有域名，即所有域名都不使用 fake-ip，而是返回真实 IP。相当于回退到 redir-host 模式。
    - "*.lan"                      # 局域网设备（如路由器、打印机等）使用真实 IP
    - "*.local"                    # 局域网设备，避免解析为假 IP
    - "localhost"
    - ".arpa"
    - "*.pool.ntp.org"
    - "time.*"
    - "*.ntp.*"
    - "*.stun.*"
    - "stun.*"
    - "dns.google"
    - "cloudflare-dns.com"
    - "localhost.ptlogin2.qq.com"  # 腾讯 QQ 登录服务避免 fake-ip
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"      # Windows 网络检测服务避免 fake-ip
    - "*.apple.com"                # Apple 相关服务避免 fake-ip，防止 iCloud 解析问题
    - "*.windows.com"              # Windows 相关域名解析为真实 IP  
    
    # ===============================
    # 一、Cloudflare Tunnel / Argo Tunnel（必须真实 IP）
    # ===============================
#    - "*.argotunnel.com"
#    - "*.v2.argotunnel.com"
#    - "*.cfargotunnel.com"
#    - "*.cftunnel.com"

    # ===============================
    # 二、Cloudflare WARP / 客户端 / Zero Trust（必须真实 IP）
    # ===============================
 #   - "*.cloudflareclient.com"
 #   - "*.cloudflarewarp.com"
 #   - "*.warp.cloudflare.com"
 #   - "*.cfwarp.com"

    # ===============================
    # 三、Cloudflare 核心控制面 / Anycast 路由（强烈建议真实 IP）
    # ===============================
#    - "*.cloudflare.com"
#    - "*.cloudflare.net"

    # ===============================
    # 四、Cloudflare DNS / DoH / DoT（避免 DNS 回环）
    # ===============================
#    - "one.one.one.one"
#    - "cloudflare-dns.com"
#    - "*.cloudflare-dns.com"

    # ===============================
    # 五、Cloudflare Zero Trust / Teams / Access（企业认证相关）
    # ===============================
#    - "*.cloudflareaccess.com"
#    - "*.cloudflareteams.com"
#    - "*.cloudflarezero.com"

    # ===============================
    # 六、Cloudflare 状态监控 / 数据分析（探测与健康检查）
    # ===============================
#    - "*.cloudflarestatus.com"
#    - "*.cloudflareinsights.com"

    # ===============================
    # 七、Cloudflare 兼容 / 测试 / 研究域名（兜底，防未来升级踩坑）
    # ===============================
#    - "*.cloudflareresearch.com"
#    - "*.cloudflaretest.com"


 # 指定域名查询的解析服务器，可使用 geosite 或'rule-set:cn': 优先于 nameserver/fallback 查询
  #nameserver-policy:
  
  # 明确标记为 CN 的域名，用下面的 DNS 解析
    #"geosite:cn":
    #- 223.5.5.5                     # 阿里 IPv4
    #- 119.29.29.29                  # 腾讯 DNSPod
    #- https://dns.alidns.com/dns-query  # 阿里 DOH
    #- https://doh.pub/dns-query         # 腾讯 DNSPod DOH
  
  # 明确标记为 非CN 的域名，用下面的 DNS 解析
    #"geosite:!cn":
    #- https://cloudflare-dns.com/dns-query   # Cloudflare DoH 域名
    #- https://doh.opendns.com/dns-query      # Opendns DOH
  
 # 默认的域名服务器，如不配置 fallback/proxy-server-nameserver，则所有域名都由 nameserver 解析
  nameserver:
    - https://dns.alidns.com/dns-query   # 阿里 DOH
    - https://doh.pub/dns-query          # 腾讯 DNSPod DOH
    #- tls://dns.alidns.com               # 阿里 DOT
    #- tls://dot.pub:853                  # 腾讯 DNSPod DOT
    #- 223.5.5.5                     # 阿里 IPv4
    #- 119.29.29.29                  # 腾讯 DNSPod
    #- 2400:3200::1        # 阿里 IPv6
    #- 2400:3200:baba::1   # 阿里 IPv6
    #- 2402:4e00::         # 腾讯 IPv6
    #- 2402:4e00:100::     # 腾讯 IPv6

 # fallback （用于解析境外网站）会查询 nameserver 中返回的 IP 是否为 CN，非必要配置
 # 当不是 CN，则使用 fallback 中的 DNS 解析
 # 解析墙外域名，推荐使用境外 DNS
  fallback:
    #- https://8.8.8.8/dns-query      # Google DoH IP
    #- https://1.1.1.1/dns-query      # Cloudflare DoH IP
    - https://dns.google/dns-query             # Google DoH 域名
    - https://cloudflare-dns.com/dns-query     # Cloudflare DoH 延迟大 非主力DNS
    #- tls://1.0.0.1:853              # Cloudflare DoT IP延迟大
    #- tls://dns.google               # Google DoT 域名
    #- tls://8.8.4.4:853              # Google DoT IP
    #- 2001:4860:4860::8844                          # Google IPv6
    #- 2606:4700:4700::1111                          # Cloudflare IPv6
    #- https://dns10.quad9.net/dns-query             # IBM DoH 无过滤 延迟140左右 无丢包
    #- https://doh.opendns.com/dns-query              # 延迟大 丢包严重
    #- https://dns.cloudflare.com/dns-query           # Cloudflare DoH 延迟大 非主力DNS
    #- https://dns-unfiltered.adguard.com/dns-query  # AdGuard DoH 非过滤 延迟150左右 无丢包
    #- https://dns11.quad9.net/dns-query             # IBM DoH ECS保护 延迟190左右 无丢包

 # 专用于节点域名解析的 DNS 服务器，非必要配置项
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query   # 阿里 DOH
    - https://doh.pub/dns-query          # 腾讯 DNSPod DOH
    #- https://8.8.8.8/dns-query      # Google DoH IP
    #- https://1.1.1.1/dns-query      # Cloudflare DoH IP
    #- https://dns.google/dns-query             # Google DoH 域名
    #- https://cloudflare-dns.com/dns-query     # Cloudflare DoH 延迟大 非主力DNS
    #- tls://1.0.0.1:853              # Cloudflare DoT IP延迟大
    #- tls://dns.google               # Google DoT 域名
    #- tls://8.8.4.4:853              # Google DoT IP
    #- 2001:4860:4860::8844                          # Google IPv6
    #- 2606:4700:4700::1111                          # Cloudflare IPv6
    #- https://dns10.quad9.net/dns-query             # IBM DoH 无过滤 延迟140左右 无丢包
    #- https://doh.opendns.com/dns-query              # 延迟大 丢包严重
    #- https://dns.cloudflare.com/dns-query           # Cloudflare DoH 延迟大 非主力DNS
    #- https://dns-unfiltered.adguard.com/dns-query  # AdGuard DoH 非过滤 延迟150左右 无丢包
    #- https://dns11.quad9.net/dns-query             # IBM DoH ECS保护 延迟190左右 无丢包

 # 用于direct出口域名解析的 DNS 服务器
 # 如果不填则遵循 nameserver-policy、nameserver 和 fallback 的配置
  #direct-nameserver:
    #- https://dns.alidns.com/dns-query   # 阿里 DOH
    #- https://doh.pub/dns-query          # 腾讯 DNSPod DOH
    #- tls://dns.alidns.com               # 阿里 DOT
    #- tls://dot.pub:853                  # 腾讯 DNSPod DOT
    #- 223.5.5.5                     # 阿里 IPv4
    #- 119.29.29.29                  # 腾讯 DNSPod
    #- 2400:3200::1        # 阿里 IPv6
    #- 2400:3200:baba::1   # 阿里 IPv6
    #- 2402:4e00::         # 腾讯 IPv6
    #- 2402:4e00:100::     # 腾讯 IPv6
  
# 是否遵循nameserver-policy，默认为不遵守，仅当direct-nameserver不为空时生效
  #direct-nameserver-follow-policy: false
    
 # fallback 过滤器（决定哪些请求用 fallback DNS解析
  fallback-filter:
    geoip: true       # 启用 GeoIP 规则
    geoip-code: CN    # geoip 库中中国 IP 走 nameserver 解析结果，非中国 IP 使用 fallback 解析结果
    geosite:          # 匹配到 geosite 库中的 gfw 的内容将只使用 fallback DNS解析
      - gfw           # 被墙的网站，直接用 fallback 解析
    ipcidr:           # 匹配到这些网段的 IP 直接使用 fallback DNS解析
      - 240.0.0.0/4
      #- 0.0.0.0/32
      #- 127.0.0.1/32
      
  # 匹配到这些域名，会直接使用 fallback 解析
    #domain:
      #- '+.google.com'
      #- '+.facebook.com'
      #- '+.youtube.com'
      #- '+.x.com'
      #- '+.twitter.com'
      #- '+.instagram.com'
      #- '+.wikipedia.org'
